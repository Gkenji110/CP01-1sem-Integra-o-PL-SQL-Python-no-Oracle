<!DOCTYPE html>
<html>
<head>
<title>As Crônicas de Kepler-186f</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>As Cronicas de Kepler-186f</h1>
<p>Aplicacao ARM + Vercel usando Oracle no modo thin.</p>

<form action="/evento" method="post">

<select name="evento">
<option value="RADIACAO">RADIACAO</option>
<option value="CRISE">CRISE</option>
</select>

<select name="setor">
<option value="COMBUSTIVEL">COMBUSTIVEL</option>
<option value="MINERAL">MINERAL</option>
<option value="DADOS">DADOS</option>
</select>

<input type="number" name="valor" value="10">

<button type="submit">Aplicar evento</button>

</form>

<br>

<table>

<tr>
<th>ID</th>
<th>Nome</th>
<th>Setor</th>
<th>Preco</th>
<th>Estoque</th>
</tr>

{% for p in produtos %}

<tr>
<td>{{p[0]}}</td>
<td>{{p[1]}}</td>
<td>{{p[2]}}</td>
<td>{{p[3]}}</td>
<td>{{p[4]}}</td>
</tr>

{% endfor %}

</table>

</body>
</html>

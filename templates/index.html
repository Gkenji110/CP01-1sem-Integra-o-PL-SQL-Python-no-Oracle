<!DOCTYPE html>
<html>

<head>

<title>As Cronicas de Kepler-186f</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>As Cronicas de Kepler-186f</h1>

<form class="form-area" action="/processar" method="post">

<select name="evento">
<option value="RADIACAO">RADIACAO</option>
<option value="CRISE">CRISE</option>
</select>

<select name="setor">
<option value="MINERAL">MINERAL</option>
<option value="COMBUSTIVEL">COMBUSTIVEL</option>
<option value="DADOS">DADOS</option>
</select>

<input type="number" name="valor" value="10" step="0.01">

<button type="submit">
Aplicar evento
</button>

</form>

<table>

<tr>
<th>ID</th>
<th>Nome</th>
<th>Setor</th>
<th>Preco</th>
<th>Estoque</th>
</tr>

{% for item in produtos %}

<tr>
<td>{{item[0]}}</td>
<td>{{item[1]}}</td>
<td>{{item[2]}}</td>
<td>{{item[3]}}</td>
<td>{{item[4]}}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
